services:
  db:
    image: postgres
    environment:
      POSTGRES_USER: nikilps
      POSTGRES_PASSWORD: Admin123
      POSTGRES_DB: wingman_db
    ports:
      - "6969:5432"

  vector_db:
    image: ghcr.io/chroma-core/chroma:latest
    ports:
      - "6379:8000"
    volumes:
      - ./chroma_data:/chroma/chroma
    environment:
      - CHROMA_SERVER_HOST=0.0.0.0
      - CHROMA_SERVER_PORT=8000